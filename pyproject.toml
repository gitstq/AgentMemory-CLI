[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentmemory"
version = "1.0.0"
description = "Lightweight stateful memory management engine for AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AgentMemory Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agentmemory = "agentmemory.cli:main"

[project.optional-dependencies]
tui = ["rich>=13.0.0"]

[tool.setuptools]
packages = ["agentmemory", "agentmemory.core", "agentmemory.storage", "agentmemory.export", "agentmemory.tui"]
